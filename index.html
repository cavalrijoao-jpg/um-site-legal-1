<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        header {
            background-color: rgb(234, 0, 255);
            color:rgb(153, 0, 255);
            text-align: center;
            max-width: 800px;
            margin: 0 auto;
            border: 4px solid rgb(0, 0, 0)
            padding: auto 2px
     }

     main{
        background-color: rgb(113, 0, 241);
        color: rgb(204, 0, 255);
        margin: 0 auto;
        display: flex;
        p {
            font-weight: bold;
        }
     }
     img {
        width: 80px;
        height: 80px;
     }
    </style>
</head>
<body>
    <header>     
      <h1>trabalho do 1 B</h1>
      <p>Aprenda a produir um site meu</p>
    </header>
 <main>
    <img src="9bb14d54-eff1-4aa8-bff5-7cb8bc76d421.jpeg" alt="imagem da aula">
    <div>
        <h2>Exercício de aula do 1 B</h2>
        <p class="autor">por: Joao pedro</p>
        <p>Este site é um exercício da aula de educação digital</p>
        <button>❤️<span>0</span></button>
    </div>
 </main>
</body>
<script>
    const botao = document.querySelector ("button");
    botao.addEventListener ("click", botaoClicado)
    function botaoClicado () {
        let texto = botao.querySelector ("span");
        texto.textContent++;
    }
</script>
</html>
